version: '3.8'

services:
  db:
    image: postgres:15
    container_name: saudi_erp_db
    environment:
      POSTGRES_DB: saudi_erp
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Saudi@ERP2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - saudi_erp_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    image: odoo:17.0
    container_name: saudi_erp_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: odoo
      PASSWORD: ${DB_PASSWORD:-Saudi@ERP2024}
    volumes:
      - ./addons:/mnt/extra-addons
      - ./docker/odoo.conf:/etc/odoo/odoo.conf
      - odoo_data:/var/lib/odoo
    ports:
      - "8069:8069"
      - "8072:8072"
    networks:
      - saudi_erp_net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: saudi_erp_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - odoo
    networks:
      - saudi_erp_net
    restart: unless-stopped

volumes:
  postgres_data:
  odoo_data:

networks:
  saudi_erp_net:
    driver: bridge
