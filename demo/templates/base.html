<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{% block title %}Saudi ERP{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --green:#1a7a4e; --green-l:#22a362; --green-d:#145f3d;
  --gold:#c9a84c;
  --sidebar:#0f1923; --sidebar-h:#1a2a38; --sidebar-w:260px;
  --bg:#f4f6f9; --card:#fff; --border:#e8ecf1;
  --txt:#1a2332; --txt2:#6b7a8d; --txt3:#9aa8b8;
  --shadow:0 2px 12px rgba(0,0,0,.08);
  --r:12px; --hh:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Tajawal',sans-serif;background:var(--bg);color:var(--txt)}
a{text-decoration:none;color:inherit}
</style>
{% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
<script>{% block js %}{% endblock %}</script>
</body>
</html>
